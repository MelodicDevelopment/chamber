# Tag-triggered release: push a `vX.Y.Z` tag and this builds signed installers
# on native runners for macOS (universal), Windows, and Linux, attaches them
# to a draft GitHub Release, then (once all three succeed) writes release notes
# from the commit log and publishes it.
#
# Required repository secrets:
#   APPLE_CERTIFICATE             base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD    password for the .p12
#   APPLE_SIGNING_IDENTITY        "Developer ID Application: Melodic Development, LLC (TEAMID)"
#   APPLE_ID                      Apple ID used for notarization
#   APPLE_PASSWORD                app-specific password for that Apple ID
#   APPLE_TEAM_ID                 Apple Developer team ID
#   AZURE_TENANT_ID               } service principal with the
#   AZURE_CLIENT_ID               } "Artifact Signing Certificate Profile
#   AZURE_CLIENT_SECRET           } Signer" role
#   TRUSTED_SIGNING_ENDPOINT      e.g. https://eus.codesigning.azure.net
#   TRUSTED_SIGNING_ACCOUNT       Artifact Signing account name
#   TRUSTED_SIGNING_PROFILE       certificate profile name
#   TAURI_SIGNING_PRIVATE_KEY     minisign private key for updater artifacts (latest.json)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty for Chamber's key)
#
# See docs/release.md for the one-time setup and the per-release checklist.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --verbose
          - platform: ubuntu-22.04
            args: --verbose
          - platform: windows-latest
            args: --verbose
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Set up Java (needed by jsign for Windows signing)
        if: matrix.platform == 'windows-latest'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download jsign (Windows signing)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          url=$(curl -s https://api.github.com/repos/ebourg/jsign/releases/latest \
            | jq -r '.assets[] | select(.name | test("\\.jar$")) | .browser_download_url' | head -n1)
          echo "Downloading $url"
          curl -sL "$url" -o jsign.jar
          echo "JSIGN_JAR=$(pwd -W)/jsign.jar" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Updater artifact signing (tauri-plugin-updater). With these set,
          # tauri-action also signs the updater archives and generates the
          # latest.json manifest it uploads alongside the release assets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # macOS signing + notarization, consumed directly by tauri-bundler.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # Windows signing via Azure Trusted Signing, consumed by
          # scripts/sign-windows.mjs through the bundle.windows.signCommand
          # hook in src-tauri/tauri.conf.json.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Chamber ${{ github.ref_name }}"
          releaseBody: "See the assets below for macOS (universal .dmg), Windows (.msi / .exe), and Linux (.AppImage / .deb / .rpm)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The three builds above attach their installers (and latest.json) to one
  # draft. Only once every platform has succeeded do we write the notes and
  # publish, so a release never goes live with an installer missing. Installed
  # copies see the new version through latest.json on their next launch.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write release notes from the commits since the previous tag
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | grep -vx "$TAG" | head -n1)
          {
            echo "## What changed"
            echo
            if [ -n "$prev" ]; then
              git log "$prev..$TAG" --no-merges --format='- %s' | grep -viE '^- (bump|release) ' || true
            else
              git log "$TAG" --no-merges --format='- %s'
            fi
            echo
            echo "## Downloads"
            echo
            echo "- macOS: \`Chamber_${TAG#v}_universal.dmg\` (Apple silicon + Intel, signed and notarized)"
            echo "- Windows: \`Chamber_${TAG#v}_x64-setup.exe\` or \`Chamber_${TAG#v}_x64_en-US.msi\` (signed)"
            echo "- Linux: \`Chamber_${TAG#v}_amd64.AppImage\`, \`.deb\`, or \`.rpm\`"
            echo
            echo "Requires \`git\` on the PATH. Installed copies update themselves from this release on next launch."
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/$prev...$TAG"
            fi
          } > notes.md
          cat notes.md

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$TAG" --repo "${{ github.repository }}" \
            --title "Chamber ${TAG#v}" \
            --notes-file notes.md \
            --draft=false --latest
          gh release view "$TAG" --repo "${{ github.repository }}" --json url,assets \
            -q '.url, (.assets[].name)'
